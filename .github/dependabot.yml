version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Minor and patch updates together in one PR. Major updates get a PR each,
      # so one incompatible major can't block every other update.
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint only supports TypeScript < 6.1 (peer dependency).
      # Remove this once typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
