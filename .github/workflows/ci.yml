name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run compile

      - name: Test (with coverage)
        run: npm run coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build and zip (Chrome, Firefox, Firefox sources)
        run: npm run zip

      - name: Lint Firefox build (addons-linter)
        run: npm run lint:firefox

      - name: Upload zips
        uses: actions/upload-artifact@v7
        with:
          name: extension-zips
          path: .output/*.zip
          retention-days: 7
